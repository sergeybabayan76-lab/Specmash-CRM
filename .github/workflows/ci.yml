name: CI & Vercel Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Database & Backend Initialization
      run: |
        python -c "import database; database.init_db()"
        python -c "import server; print('Backend loaded successfully:', server.app.title)"
        python -c "import api.index; print('Vercel handler loaded successfully:', api.index.app.title)"
